[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain"
version = "0.1.0"
description = "A connectome-constrained fly brain SDK: fly neural circuits as typed sensory and motor ports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "numpy>=1.21",
    "flyvis>=1.2.0",
]

[project.optional-dependencies]
# The male_cns circuit reads the MaleCNS v1.0 release tables (Arrow feather)
# and holds the connectome as a scipy sparse matrix. Nothing else in the SDK
# needs these, so they are an extra rather than a hard dependency.
male_cns = ["pandas>=1.5", "pyarrow>=10.0", "scipy>=1.9"]
demo = ["matplotlib>=3.5", "pillow>=9.0"]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "pillow>=9.0",
    "pandas>=1.5",
    "pyarrow>=10.0",
    "scipy>=1.9",
]

[tool.setuptools.packages.find]
include = ["flybrain*"]

[tool.setuptools.package-data]
flybrain = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
